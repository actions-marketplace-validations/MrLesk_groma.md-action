name: Groma architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  GROMA_THEME: blueprint

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build architecture website
        id: map
        uses: MrLesk/groma.md-action@v1
        with:
          groma-version: '0.6.5'
          theme: ${{ env.GROMA_THEME }}

      - uses: actions/upload-artifact@v4
        with:
          name: groma-map
          path: ${{ steps.map.outputs.output }}
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    # The map shares one Pages site with PR comparisons. Serialize publication.
    concurrency:
      group: groma-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.map.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: groma-map
          path: map
      - uses: MrLesk/groma.md-action/publish@v1
        id: map
        with:
          directory: map
          theme: ${{ env.GROMA_THEME }}
          token: ${{ github.token }}
