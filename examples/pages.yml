name: Groma architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GROMA_THEME: blueprint

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build architecture website
        id: map
        uses: MrLesk/groma.md-action@v1
        with:
          groma-version: '0.6.5'
          theme: ${{ env.GROMA_THEME }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.map.outputs.output }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.map-url.outputs.url }}
    steps:
      - name: Publish architecture website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link to the architecture map
        id: map-url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "url=${PAGE_URL%/}/architecture/$GROMA_THEME/" >> "$GITHUB_OUTPUT"
