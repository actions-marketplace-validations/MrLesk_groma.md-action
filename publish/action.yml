name: Publish Groma architecture
description: Retain PR comparisons and the default-branch map on dedicated GitHub Pages and update each PR's review comment.
inputs:
  pull-request:
    description: PR number selected for this comparison. Leave it empty to publish the default-branch map.
    default: ${{ github.event.pull_request.number }}
  base:
    description: Exact PR base commit when the comparison was selected.
    default: ${{ github.event.pull_request.base.sha }}
  revision:
    description: Default-branch commit the map was built from. Used only without pull-request.
    default: ${{ github.sha }}
  directory:
    description: Downloaded website root from the build.
    required: true
  theme:
    description: Theme used by the build Action.
    default: auto
  token:
    description: GitHub token with contents write permission, plus pull-requests write for PR comparisons.
    required: true
outputs:
  url:
    description: Published comparison or map URL (empty for an outdated build).
    value: ${{ steps.link.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare filtered TLS trust before network steps
      id: node-trust
      uses: actions/github-script@v9.0.0
      env:
        NODE_OPTIONS: --use-bundled-ca
        GROMA_TRUST_BOOTSTRAP: ${{ github.action_path }}/../trust-bootstrap.cjs
      with:
        script: |
          const trust = require(process.env.GROMA_TRUST_BOOTSTRAP);
          const settings = trust.prepareWorkflowTrust();
          trust.exportSettings(settings.node, process.env.GITHUB_ENV);
          core.setOutput('cafile', settings.openssl.SSL_CERT_FILE);
          core.setOutput('capath', settings.openssl.SSL_CERT_DIR);

    - uses: actions/setup-node@v7.1.0
      env:
        NODE_OPTIONS: --use-openssl-ca
        SSL_CERT_FILE: ${{ steps.node-trust.outputs.cafile }}
        SSL_CERT_DIR: ${{ steps.node-trust.outputs.capath }}
      with:
        node-version: 26.12.1
        package-manager-cache: false
    - name: Store this build on the Pages branch
      id: store
      shell: bash
      env:
        NODE_OPTIONS: --use-bundled-ca
        GH_TOKEN: ${{ inputs.token }}
        GROMA_DIRECTORY: ${{ inputs.directory }}
        GROMA_THEME: ${{ inputs.theme }}
        GROMA_PULL_REQUEST: ${{ inputs.pull-request }}
        GROMA_BASE: ${{ inputs.base }}
        GROMA_REVISION: ${{ inputs.revision }}
      run: node "$GITHUB_ACTION_PATH/publish.mjs" store
    - uses: actions/upload-pages-artifact@v5.0.0
      env:
        NODE_OPTIONS: --use-openssl-ca
        SSL_CERT_FILE: ${{ steps.node-trust.outputs.cafile }}
        SSL_CERT_DIR: ${{ steps.node-trust.outputs.capath }}
      if: steps.store.outputs.ready == 'true'
      with:
        path: ${{ steps.store.outputs.site }}
    - uses: actions/deploy-pages@v5.0.1
      env:
        NODE_OPTIONS: --use-openssl-ca
        SSL_CERT_FILE: ${{ steps.node-trust.outputs.cafile }}
        SSL_CERT_DIR: ${{ steps.node-trust.outputs.capath }}
      if: steps.store.outputs.ready == 'true'
      id: deploy
    - name: Link the publication
      if: steps.store.outputs.ready == 'true'
      id: link
      shell: bash
      env:
        NODE_OPTIONS: --use-bundled-ca
        GH_TOKEN: ${{ inputs.token }}
        GROMA_DIRECTORY: ${{ inputs.directory }}
        GROMA_THEME: ${{ inputs.theme }}
        GROMA_PULL_REQUEST: ${{ inputs.pull-request }}
        GROMA_BASE: ${{ inputs.base }}
        GROMA_REVISION: ${{ inputs.revision }}
        GROMA_PAGE_URL: ${{ steps.deploy.outputs.page_url }}
      run: node "$GITHUB_ACTION_PATH/publish.mjs" link
